<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Posts</title>
  </head>

  <body>
    <h1>Posts</h1>
    <a href="read-all.php">Read All Posts</a>
    <!-- Create -->
    <form
      action="../src/add-delete.php"
      method="POST"
    >
      <input
        type="hidden"
        name="action"
        value="add"
      />
      <input
        type="text"
        name="content"
        placeholder="New post content"
        required
      />
      <button type="submit">Add</button>
    </form>

    <!-- Update -->
    <form
      action="../src/add-delete.php"
      method="POST"
    >
      <input
        type="hidden"
        name="action"
        value="update"
      />
      <input
        type="number"
        name="post_id"
        placeholder="Post ID"
        required
      />
      <input
        type="text"
        name="content"
        placeholder="New content"
        required
      />
      <button type="submit">Update</button>
    </form>

    <!-- Delete -->
    <form
      action="../src/add-delete.php"
      method="POST"
    >
      <input
        type="hidden"
        name="action"
        value="delete"
      />
      <input
        type="number"
        name="post_id"
        placeholder="Post ID to delete"
        required
      />
      <button type="submit">Delete</button>
    </form>

    <br />
    <!-- Logout -->
    <form
      action="../src/logout.php"
      method="POST"
    >
      <button type="submit">Logout</button>
    </form>
  </body>
</html>
